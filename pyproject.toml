[project]
name = "gpx2reel"
version = "0.1.0"
description = "GPX, FIT and Garmin ZIP tracks -> 3D route videos rendered with Blender."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "fitdecode>=0.10",
    "pyproj>=3.6",
    "shapely>=2.0",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "timezonefinder>=6.5",
    "rasterio>=1.3",   # ESA WorldCover land cover (COG over HTTP): stylized terrain, beach / sunset sets
    "scipy>=1.11",
]

[project.optional-dependencies]
# Blender as a Python module (headless); bpy 5.2 wheels exist only for CPython 3.13.
blender = ["bpy~=5.2.0"]
# style.terrain: stylized / hybrid — roads, rivers and places from a Geofabrik extract (`gpx2reel osm`)
stylized = ["osmium>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
gpx2reel = "gpx2reel.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpx2reel = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
